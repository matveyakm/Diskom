  # Career report
  postgres_ms_career_report:
    image: postgres:latest
    container_name: postgres_ms_career_report
    command: postgres -c listen_addresses=172.25.0.64 -c port=5434
    restart: always
    env_file:
      - ./source/reports/ms_career_report/parameters.env
    volumes:
      - postgres_ms_career_report:/var/lib/postgresql
      - ./source/reports/ms_career_report/dbshell:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      vnet:
        ipv4_address: 172.25.0.64

  api_ms_career_report:
    build:
      context: .
      dockerfile: ./Dockerfiles/ms_career_report
    container_name: api_ms_career_report
    restart: always
    env_file:
      - ./source/reports/ms_career_report/parameters.env
    networks:
      vnet:
        ipv4_address: 172.25.0.65
    labels:
      - "traefik.enable=true" # Включает обнаружение
      - "traefik.http.routers.api_ms_career_report.rule=(Host(`discom.spbgu.90.188.89.63.nip.io`) || Host(`discom.spbgu.localhost`)) && PathPrefix(`/api/career_report`)" # Укажите домен
      - "traefik.http.services.api_ms_career_report.loadbalancer.server.port=8443" #
      - "traefik.http.routers.api_ms_career_report.entrypoints=websecure" # Слушаем только 443
      - "traefik.http.routers.api_ms_career_report.tls=true" # Включаем TLS снаружи
