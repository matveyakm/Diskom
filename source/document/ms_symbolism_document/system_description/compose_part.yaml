  # Symbolism order document
  postgres_ms_symbolism_document:
    image: postgres:latest
    container_name: postgres_ms_symbolism_document
    command: postgres -c listen_addresses=172.25.0.105 -c port=5434
    restart: always
    env_file:
      - ./source/document/ms_symbolism_document/parameters.env
    volumes:
      - postgres_ms_symbolism_document:/var/lib/postgresql
      - ./source/document/ms_symbolism_document/dbshell:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      vnet:
        ipv4_address: 172.25.0.105

  api_ms_symbolism_document:
    build:
      context: .
      dockerfile: ./Dockerfiles/ms_symbolism_document
    container_name: api_ms_symbolism_document
    restart: always
    env_file:
      - ./source/document/ms_symbolism_document/parameters.env
    networks:
      vnet:
        ipv4_address: 172.25.0.106
    labels:
      - "traefik.enable=true" # Включает обнаружение
      - "traefik.http.routers.api_ms_symbolism_document.rule=(Host(`discom.spbgu.90.188.89.63.nip.io`) || Host(`discom.spbgu.localhost`)) && PathPrefix(`/api/symbolism_document`)" # Укажите домен
      - "traefik.http.services.api_ms_symbolism_document.loadbalancer.server.port=8443" #
      - "traefik.http.routers.api_ms_symbolism_document.entrypoints=websecure" # Слушаем только 443
      - "traefik.http.routers.api_ms_symbolism_document.tls=true" # Включаем TLS снаружи
