events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss application/json;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Кэширование статики: immutable убран намеренно —
        # при активной разработке браузер иначе держит старый JS год.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # /api/* должен обрабатываться Traefik -> Go API, а не этим
        # контейнером. Если запрос всё же попал сюда (API ещё не
        # поднялся), отвечаем JSON-ошибкой, а не index.html (иначе
        # клиент получает "JSON.parse: unexpected character").
        location ^~ /api/ {
            default_type application/json;
            return 503 '{"error":"api service unavailable"}';
        }

        # SPA роутинг - все запросы на index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html никогда не кэшируется: иначе браузер держит
        # старый список <script> и приложение грузит устаревший JS.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }

        # Health check для Traefik
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
