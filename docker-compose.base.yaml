services:
  # --- Infrastructure services ---
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      vnet:
        ipv4_address: 172.25.0.5

    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
      - ./dynamic:/dynamic:ro

    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"

      # File provider для TLS
      - "--providers.file.filename=/dynamic/tls.yaml"
      - "--providers.file.watch=true"

      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=disciplinary-committee_vnet"

      # API & Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # Observability
      - "--log.level=DEBUG" # Временно DEBUG для отладки
      - "--accesslog=true"
      - "--metrics.prometheus=true"

      # Tracing
      - "--tracing=true"
      - "--tracing.otlp=true"
      - "--tracing.otlp.grpc=true"
      - "--tracing.otlp.grpc.endpoint=jaeger:4317"
      - "--tracing.otlp.grpc.insecure=true"

    labels:
      # Enable self‑routing
      - "traefik.enable=true"
      - "traefik.docker.network=disciplinary-committee_vnet"

      # Dashboard router
      - "traefik.http.routers.dashboard.rule=(Host(`dashboard.docker.90.188.89.63.nip.io`) || Host(`dashboard.docker.localhost`))"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@docker"

      # Basic‑auth middleware
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=traefik_admin:$$apr1$$3m3TPtw2$$bR2Gj8CtLaSUKWdlg0X9V."

  # Whoami application
  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: unless-stopped
    networks:
      vnet:
        ipv4_address: 172.25.0.6

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=(Host(`whoami.docker.90.188.89.63.nip.io`) || Host(`whoami.docker.localhost`))"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls=true"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI to see your traces
    networks:
      vnet:
        ipv4_address: 172.25.0.7 # Assign a static IP within your subnet

  #  frontend-js:
  #    build:
  #      context: ./protofront
  #      dockerfile: Dockerfile
  #    container_name: frontend-js
  #    restart: unless-stopped
  #    labels:
  #      - "traefik.enable=true"
  #      - "traefik.docker.network=disciplinary-committee_vnet"
  #      - "traefik.http.routers.frontend-js.rule=Host(`discom.spbgu.90.188.89.63.nip.io`) || Host('discom.spbgu.localhost`)"
  #      - "traefik.http.routers.frontend-js.entrypoints=websecure"
  #      - "traefik.http.services.frontend-js.loadbalancer.server.port=80"
  #      - "traefik.http.routers.frontend-js.priority=1000"
  #    networks:
  #      vnet:
  #        ipv4_address: 172.25.0.8 # Assign a static IP within your subnet

  frontend-app:
    image: node:20-alpine
    container_name: frontend-app
    working_dir: /app
    stdin_open: true
    tty: true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "
        if [ ! -d node_modules ] || [ ! -f node_modules/.npm-ready ];
        then npm install && touch node_modules/.npm-ready;
        fi;
        npm run dev -- --host 0.0.0.0
      "
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-app.rule=Host(`discom.spbgu.90.188.89.63.nip.io`) || Host(`discom.spbgu.localhost`)"
      - "traefik.http.routers.frontend-app.entrypoints=websecure"
      - "traefik.http.routers.frontend-app.tls=true"
      - "traefik.http.services.frontend-app.loadbalancer.server.port=5173"
    networks:
      vnet:
        ipv4_address: 172.25.0.9

  # ---  Microservices ---

# compose:services:begin
# compose:services:end
# compose:volumes:begin
# compose:volumes:end

# --- Shared resources ---
networks:
  vnet:
    name: disciplinary-committee_vnet
    driver: bridge
    attachable: true
    # --- IPAM ---
    ipam:
      config:
        - subnet: 172.25.0.0/24
          gateway: 172.25.0.1